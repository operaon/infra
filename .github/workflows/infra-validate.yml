name: Infrastructure Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: infra-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate infrastructure manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check --no-input pyyaml

      - name: Validate compose structure
        run: python scripts/validate-compose.py

      - name: Validate Nginx syntax with container
        run: |
          docker run --rm \
            -v "$PWD/nginx:/etc/nginx:ro" \
            nginx:1.27-alpine nginx -t

      - name: Reject tracked runtime secrets
        shell: bash
        run: |
          set -euo pipefail
          ! git ls-files -z | grep -zEq '(^|/)(\.env|.*\.pem|.*\.key)$'
          ! git grep -n -E 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk_live_[A-Za-z0-9]{10,}|whsec_[A-Za-z0-9]{10,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' -- ':!audit-artifacts'

      - name: Reject legacy infrastructure paths
        shell: bash
        run: |
          set -euo pipefail
          ! git grep -n -E 'velyon_(api|frontend|chat|crm|pay|agend|catalog|billing)|context: ../../velyon_' -- docker nginx scripts
