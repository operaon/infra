services:
  # ==================== Redis Cache ====================
  redis:
    image: redis:7-alpine
    container_name: prod_redis
    restart: always
    command: redis-server --appendonly yes --requirepass qoRufVQAZqOQ5Bnrn5VzNkQjF4sjlBef --maxmemory 512mb --maxmemory-policy allkeys-lru
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
        labels: "service=redis"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M

  # ==================== Node.js API ====================
  api:
    image: api-clinica:production
    build:
      context: ../../velyon_api
      dockerfile: ../velyon_infra/docker/Dockerfile.api.prod
    container_name: prod_api
    restart: always
    env_file:
      - ../../velyon_api/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      FRONTEND_URL: https://fisioterapeuta.velyonrobotics.com
      DATABASE_URL: postgresql://dbadmin:SenhaForte2026@velyon:6432/velyon?sslmode=require
      REDIS_URL: redis://:qoRufVQAZqOQ5Bnrn5VzNkQjF4sjlBef@redis:6379/0
      DB_HOST: velyon
      DB_PORT: 6432
      DB_NAME: velyon
      DB_USER: dbadmin
      DB_PASSWORD: SenhaForte2026
      DATABASE_SSL: "true"
    extra_hosts:
      - "velyon:177.223.51.25"
    expose:
      - 3000
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../../velyon_api/logs:/app/logs
      - ../../velyon_api/tmp:/app/tmp
    networks:
      - app_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=api"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "1"
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ==================== Node.js Frontend Tenant ====================
  frontend:
    image: tenant-frontend:production
    build:
      context: ../../velyon_frontend_tenant
      dockerfile: ../velyon_infra/docker/Dockerfile.frontend.prod
      args:
        VITE_API_BASE_URL: https://api.velyonrobotics.com/api
    container_name: prod_frontend
    restart: always
    env_file:
      - ../../velyon_frontend_tenant/.env
    environment:
      NODE_ENV: production
      PORT: 5173
      VITE_API_BASE_URL: https://api.velyonrobotics.com/api
      EXTERNAL_API_URL: http://api:3000/api
    expose:
      - 5173
    volumes:
      - ../../velyon_frontend_tenant/logs:/app/logs
      - ../../velyon_frontend_tenant/tmp:/app/tmp
    networks:
      - app_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=frontend"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "1"
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ==================== Static Site Frontend ====================
  site:
    image: site-frontend:production
    build:
      context: ../../velyon_frontend_site
      dockerfile: ../velyon_infra/docker/Dockerfile.site.prod
      args:
        VITE_API_BASE_URL: https://api.velyonrobotics.com/api
    container_name: prod_site
    restart: always
    expose:
      - 5174
    networks:
      - app_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=site"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
        reservations:
          cpus: "0.5"
          memory: 128M
    healthcheck:
      test:
        ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5174/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ==================== Nginx Reverse Proxy ====================
  nginx:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nginx
    image: app-nginx:production
    container_name: prod_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/logs:/var/log/nginx
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
      site:
        condition: service_healthy
    networks:
      - app_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=nginx"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
        reservations:
          cpus: "0.5"
          memory: 128M
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1/nginx-health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ==================== Certbot (Let's Encrypt) ====================
  certbot:
    image: certbot/certbot:latest
    container_name: prod_certbot
    restart: "no"
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # Emite o certificado na primeira execução.
    # Após emitido, este container fica parado — a renovação é feita
    # pelo script scripts/renew-certs.sh via cron no host.
    entrypoint: >
      certbot certonly
        --webroot
        --webroot-path=/var/www/certbot
        --non-interactive
        --agree-tos
        --email admin@velyonrobotics.com
        -d velyonrobotics.com
        -d www.velyonrobotics.com
        -d fisioterapeuta.velyonrobotics.com
        -d api.velyonrobotics.com
    networks:
      - app_network

volumes:
  redis_data:
  certbot_www:
  certbot_certs:

networks:
  app_network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1450
