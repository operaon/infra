services:
  # ==================== Redis (cache + filas BullMQ) ====================
  # Instância única compartilhada entre cache/sessão (velyon_api) e filas de
  # jobs (velyon_chat, velyon_billing, etc). maxmemory-policy=noeviction:
  # com allkeys-lru, o Redis descartava chaves silenciosamente sob pressão
  # de memória, o que é aceitável para cache mas destrutivo para filas
  # (perda de jobs sem erro visível). Com noeviction, ao atingir maxmemory
  # os comandos de escrita retornam erro (OOM) em vez de apagar dados —
  # mais seguro para as filas, mas exige monitorar o uso de memória.
  redis:
    image: redis:7-alpine
    container_name: velyon_redis
    restart: always
    # REDIS_PASSWORD vem do mesmo env_file usado pela api (fonte única de
    # verdade). $$ escapa o interpolador do Compose: a expansão real de
    # $REDIS_PASSWORD acontece em runtime, pelo shell dentro do container.
    env_file:
      - ../../velyon_api/.env
    command: sh -c 'redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD" --maxmemory 512mb --maxmemory-policy noeviction'
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      # CMD-SHELL (não CMD) porque precisamos de expansão de variável de
      # ambiente ($REDIS_PASSWORD) em runtime dentro do container.
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
        labels: "service=redis"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M

  # ==================== Node.js API ====================
  # Usa sempre o mesmo banco Postgres (externo, gerenciado fora deste
  # compose) tanto em produção quanto em ambiente local de desenvolvimento.
  # Não existe container de Postgres aqui: DB_HOST/DATABASE_URL sempre
  # apontam para o mesmo banco, via env_file (.env compartilhado).
  api:
    image: api-clinica:latest
    build:
      context: ../../velyon_api
      dockerfile: ../velyon_infra/docker/Dockerfile.api.prod
    container_name: velyon_api
    restart: always
    # NODE_ENV, PORT, DATABASE_URL, DATABASE_SSL, REDIS_URL, FRONTEND_URLS,
    # CORS_ORIGIN etc. vêm todos do env_file abaixo — fonte única de
    # verdade, igual em produção, Docker local e `pnpm dev` (sem Docker).
    # Antes esses valores eram duplicados aqui via interpolação
    # (${DB_USER}, ${DB_PASSWORD}...) lidos do docker/.env, criando risco
    # de divergência entre os dois arquivos. Removido para eliminar a
    # duplicação — ver docker/.env para o que ainda é exclusivo da infra
    # (REDIS_PASSWORD usado no comando do container redis).
    env_file:
      - ../../velyon_api/.env
    expose:
      - 3000
    # Publica 3000 SÓ em loopback (127.0.0.1), nunca em 0.0.0.0: permite
    # rodar o frontend local via `pnpm dev` (fora do Docker, ver
    # velyon_frontend_tenant/.env.local.example) acessando a api
    # dockerizada em http://localhost:3000, sem expor a api publicamente
    # — em produção o nginx continua sendo o único ponto de entrada
    # externo, via rede interna do Docker (http://api:3000).
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../../velyon_api/logs:/app/logs
      - ../../velyon_api/tmp:/app/tmp
    networks:
      - app_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=api"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "1"
          memory: 512M
    healthcheck:
      # Usa CMD-SHELL para permitir operador || e forçar IPv4 explicitamente
      # (algumas imagens resolvem localhost para ::1 primeiro). Aumenta
      # start_period para dar mais tempo ao processo terminar migrações
      # e conectar ao DB/Redis antes do Docker considerar o serviço unhealthy.
      # Tenta IPv4 primeiro, cai para IPv6 (::1) se necessário.
      test: ["CMD-SHELL", "curl --fail --show-error --max-time 5 --ipv4 http://127.0.0.1:3000/health || curl --fail --show-error --max-time 5 --ipv6 http://[::1]:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s

  # ==================== Node.js Frontend Tenant ====================
  frontend:
    image: tenant-frontend:latest
    build:
      context: ../../velyon_frontend_tenant
      dockerfile: ../velyon_infra/docker/Dockerfile.frontend.prod
      args:
        # VITE_API_BASE_URL propositalmente não definido: o frontend já
        # usa "/api" (relativo) como padrão quando a variável não existe,
        # resolvendo sempre para o mesmo domínio que serviu a página
        # (fisioterapeuta.velyonrobotics.com/api/...) via proxy interno
        # do nginx. A API nunca precisa de um domínio público próprio.
    container_name: velyon_frontend
    restart: always
    # NODE_ENV, PORT e EXTERNAL_API_URL vêm todos do env_file abaixo —
    # fonte única de verdade, sem duplicação/hardcode aqui no compose.
    env_file:
      - ../../velyon_frontend_tenant/.env
    expose:
      - 5173
    volumes:
      - ../../velyon_frontend_tenant/logs:/app/logs
      - ../../velyon_frontend_tenant/tmp:/app/tmp
    networks:
      - app_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=frontend"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "1"
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ==================== Static Site Frontend ====================
  site:
    image: site-frontend:latest
    build:
      context: ../../velyon_frontend_site
      dockerfile: ../velyon_infra/docker/Dockerfile.site.prod
      args:
        VITE_CLARITY_PROJECT_ID: ${VITE_CLARITY_PROJECT_ID:-}
    container_name: velyon_site
    restart: always
    # NODE_ENV, PORT, SESSION_SECRET, CORS_ORIGIN etc. vêm todos do
    # env_file abaixo — antes este serviço não tinha env_file nenhum e
    # o velyon_frontend_site/.env não era efetivamente usado no build/run.
    env_file:
      - ../../velyon_frontend_site/.env
    expose:
      - 5174
    networks:
      - app_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=site"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
        reservations:
          cpus: "0.5"
          memory: 128M
    healthcheck:
      test:
        ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5174/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ==================== Node.js Frontend Client (Paciente) ====================
  client:
    image: client-frontend:latest
    build:
      context: ../../velyon_frontend_client
      dockerfile: ../velyon_infra/docker/Dockerfile.client.prod
      # VITE_API_BASE_URL propositalmente não definido, mesmo motivo do
      # serviço "frontend": usa "/api" (relativo) por padrão, resolvendo
      # sempre para o domínio que serviu a página
      # (paciente.velyonrobotics.com/api/...) via proxy interno do nginx.
    container_name: velyon_frontend_client
    restart: always
    # NODE_ENV, PORT e EXTERNAL_API_URL vêm todos do env_file abaixo —
    # fonte única de verdade, mesmo padrão do serviço "frontend".
    env_file:
      - ../../velyon_frontend_client/.env
    expose:
      - 5175
    volumes:
      - ../../velyon_frontend_client/logs:/app/logs
      - ../../velyon_frontend_client/tmp:/app/tmp
    networks:
      - app_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=client"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "1"
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5175/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ==================== Nginx Reverse Proxy ====================
  # Mesma imagem/config em produção e local. Se houver certificados SSL
  # válidos montados em /etc/letsencrypt (volume certbot_certs), o HTTPS
  # é habilitado automaticamente no startup (ver
  # nginx/docker-entrypoint.d/10-enable-ssl.sh). Sem certificados —
  # caso de uma máquina local sem domínio público — o Nginx serve tudo
  # em HTTP simples (porta 80), usando os mesmos nomes de domínio
  # (resolvidos localmente via /etc/hosts apontando para 127.0.0.1).
  # ==================== Provisionamento automático de SSL ====================
  # Roda uma única vez, ANTES do nginx, garantindo que sempre exista um
  # certificado válido — tenta Let's Encrypt (produção, DNS público) e
  # cai automaticamente para autoassinado (local) se não conseguir.
  # Não requer nenhuma etapa manual: acontece em todo "docker compose up".
  # Ver scripts/cert-init-entrypoint.sh para a lógica completa.
  cert-init:
    build:
      context: ..
      dockerfile: docker/Dockerfile.certinit
    image: velyon-cert-init:latest
    container_name: velyon_cert_init
    restart: "no"
    # LETSENCRYPT_EMAIL e DOMAINS vêm do docker/.env (exclusivo da infra,
    # não pertence a nenhum app específico).
    env_file:
      - .env
    ports:
      # Necessário apenas para o desafio HTTP-01 do modo --standalone
      # do certbot. Sem conflito com o nginx: este container sempre
      # termina (exit) antes do nginx ser criado (depends_on abaixo),
      # liberando a porta 80.
      - "80:80"
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - app_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=cert-init"

  # ==================== Renovação Automática (Daemon) ====================
  cert-renew:
    build:
      context: ..
      dockerfile: docker/Dockerfile.certrenew
    image: velyon-cert-renew:latest
    container_name: velyon_cert_renew
    restart: always
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    networks:
      - app_network

  # ==================== MinIO (Object Storage) ====================
  minio:
    image: minio/minio:latest
    container_name: velyon_minio
    restart: always
    # Sem env_file aqui de propósito: o servidor MinIO só precisa das vars
    # do bloco "environment:" abaixo (MINIO_ROOT_USER/PASSWORD). Um
    # env_file: .env vazaria também MINIO_ACCESS_KEY/MINIO_SECRET_KEY (nomes
    # depreciados, usados só pelo cliente SDK no velyon_api) pro processo do
    # MinIO, que os detecta e emite o warning "MINIO_ACCESS_KEY and
    # MINIO_SECRET_KEY are deprecated" mesmo com ROOT_USER/PASSWORD certos.
    command: server /minio_data --console-address ":9001"
    expose:
      - "9000"
      - "9001"
    # Sem "ports:" de propósito — igual frontend/site: o MinIO nunca é
    # acessado diretamente pelo navegador. O nginx faz proxy de /minio/
    # para http://minio:9000 (ver $minio_upstream em conf.d/10-http.conf
    # e 20-https.conf.template + snippets/tenant-locations.conf), mesmo
    # padrão de $api_upstream/$frontend_upstream já usado no projeto.
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      # Sem isso, o MinIO redireciona (307) qualquer requisição "estilo
      # navegador" sem assinatura S3 válida para o console (porta 9001) —
      # é exatamente o caso das logos públicas (uploadLogo com publicRead:
      # true gera URL sem assinatura, ver storageService.js). Atrás do
      # proxy nginx (/minio/), o Host repassado é o domínio público, então
      # o redirect virava http://<dominio>:9001/, uma porta que não existe
      # no host → ERR_CONNECTION_REFUSED no navegador.
      MINIO_BROWSER_REDIRECT: "off"
    volumes:
      - minio_data:/minio_data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
        labels: "service=minio"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "1"
          memory: 1G

  nginx:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nginx
    image: app-nginx:latest
    container_name: velyon_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/logs:/var/log/nginx
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      cert-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
      site:
        condition: service_healthy
      client:
        condition: service_healthy
      chat:
        condition: service_healthy
      crm:
        condition: service_healthy
      pay:
        condition: service_healthy
      agend:
        condition: service_healthy
      catalog:
        condition: service_healthy
      billing:
        condition: service_healthy
    networks:
      - app_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=nginx"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
        reservations:
          cpus: "0.5"
          memory: 128M
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1/nginx-health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ==================== Node.js Chat Service ====================
  # Serviço de chat em tempo real (Socket.IO). Usa o mesmo Redis e
  # MinIO do velyon_infra (via rede Docker). Banco PostgreSQL externo
  # (177.223.51.25:6432) configurado via .env. O Nginx faz proxy reverso
  # para chat:4000 sob o domínio chat.velyonrobotics.com.
  chat:
    image: chat-service:latest
    build:
      context: ../../velyon_chat
      dockerfile: ../velyon_infra/docker/Dockerfile.chat.prod
    container_name: velyon_chat
    restart: always
    env_file:
      - ../../velyon_chat/.env
    expose:
      - 4000
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ../../velyon_chat/logs:/app/logs
      - ../../velyon_chat/tmp:/app/tmp
    networks:
      - app_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=chat"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ==================== Node.js CRM Service ====================
  # Serviço de CRM (leads, automação, reminders). Banco PostgreSQL externo
  # (177.223.51.25:6432) configurado via .env. Nginx faz proxy reverso
  # para crm:4200 sob o domínio crm.velyonrobotics.com.
  crm:
    image: crm-service:latest
    build:
      context: ../../crm
      dockerfile: docker/Dockerfile.crm.prod
    container_name: velyon_crm
    restart: always
    env_file:
      - ../../crm/.env
    expose:
      - 4200
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../../crm/logs:/app/logs
      - ../../crm/tmp:/app/tmp
    networks:
      - app_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=crm"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4200/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ==================== Node.js Pay Service ====================
  # Serviço de pagamentos (Paytime, boletos, cartões). Banco PostgreSQL
  # externo (177.223.51.25:6432) configurado via .env. Nginx faz proxy
  # reverso para pay:4500 sob o domínio pay.velyonrobotics.com.
  pay:
    image: pay-service:latest
    build:
      context: ../../pay
      dockerfile: docker/Dockerfile.pay.prod
    container_name: velyon_pay
    restart: always
    env_file:
      - ../../pay/.env
    expose:
      - 4500
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../../pay/logs:/app/logs
      - ../../pay/tmp:/app/tmp
    networks:
      - app_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=pay"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4500/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ==================== Node.js Agenda Service ====================
  # Serviço de agendamentos e escalas. Banco PostgreSQL externo
  # (177.223.51.25:6432) configurado via .env. Nginx faz proxy reverso
  # para agend:4300 sob o domínio agend.velyonrobotics.com.
  agend:
    image: agend-service:latest
    build:
      context: ../../velyon_agend
      dockerfile: ../velyon_infra/docker/Dockerfile.agend.prod
    container_name: velyon_agend
    restart: always
    env_file:
      - ../../velyon_agend/.env
    expose:
      - 4300
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../../velyon_agend/logs:/app/logs
      - ../../velyon_agend/tmp:/app/tmp
    networks:
      - app_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=agend"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4300/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ==================== Node.js Catalog Service ====================
  # Serviço de catálogo de produtos e preços. Banco PostgreSQL externo
  # (177.223.51.25:6432) configurado via .env. Nginx faz proxy reverso
  # para catalog:4400 sob o domínio catalog.velyonrobotics.com.
  catalog:
    image: catalog-service:latest
    build:
      context: ../../velyon_catalog
      dockerfile: ../velyon_infra/docker/Dockerfile.catalog.prod
    container_name: velyon_catalog
    restart: always
    env_file:
      - ../../velyon_catalog/.env
    expose:
      - 4400
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../../velyon_catalog/logs:/app/logs
      - ../../velyon_catalog/tmp:/app/tmp
    networks:
      - app_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=catalog"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4400/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ==================== Node.js Billing Service ====================
  # Serviço de faturamento (contratos, vendas, descontos, splits).
  # Banco PostgreSQL externo (177.223.51.25:6432) configurado via .env.
  # Nginx faz proxy reverso para billing:4600 sob billing.velyonrobotics.com.
  billing:
    image: billing-service:latest
    build:
      context: ../../velyon_billing
      dockerfile: ../velyon_infra/docker/Dockerfile.billing.prod
    container_name: velyon_billing
    restart: always
    env_file:
      - ../../velyon_billing/.env
    expose:
      - 4600
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../../velyon_billing/logs:/app/logs
      - ../../velyon_billing/tmp:/app/tmp
    networks:
      - app_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=billing"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4600/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ==================== Certbot (Let's Encrypt) — renovação manual ====================
  # Usado apenas para RENOVAÇÃO periódica em produção (via cron +
  # scripts/renew-certs.sh), com o nginx já rodando (método webroot).
  # O provisionamento inicial automático é feito pelo serviço
  # cert-init acima. Este aqui não inicia automaticamente com
  # "docker compose up" — precisa do profile "certbot" explicitamente.
  # Em ambiente local, simplesmente nunca é executado.
  certbot:
    image: certbot/certbot:v5.5.0
    container_name: velyon_certbot
    restart: "no"
    # profile próprio: NÃO sobe com "docker compose up" (mesmo sem -d
    # ou --build). Só roda quando chamado explicitamente com
    # "docker compose --profile certbot run --rm certbot ...", como
    # fazem scripts/init-certs.sh e scripts/renew-certs.sh.
    # Sem isso, o certbot tentava emitir certificado toda vez que o
    # stack subia — incluindo em máquinas locais sem domínio público,
    # arriscando bater no rate limit do Let's Encrypt.
    profiles:
      - certbot
    # LETSENCRYPT_EMAIL e DOMAINS vêm do docker/.env (mesma fonte usada
    # pelo cert-init, evitando duplicação/divergência entre os dois).
    env_file:
      - .env
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: >
      sh -c '
        DOMAIN_ARGS="";
        for d in $$(echo "$$DOMAINS" | tr "," " "); do
          DOMAIN_ARGS="$$DOMAIN_ARGS -d $$d";
        done;
        certbot certonly
          --webroot
          --webroot-path=/var/www/certbot
          --non-interactive
          --agree-tos
          --email "$$LETSENCRYPT_EMAIL"
          $$DOMAIN_ARGS
      '
    networks:
      - app_network

volumes:
  redis_data:
  certbot_www:
  certbot_certs:
  minio_data:
  # (billing usa bind mounts, sem volumes nomeados)


networks:
  app_network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1450
