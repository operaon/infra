services:
  # ==================== PostgreSQL (local) ====================
  # Em produção o Postgres é externo (gerenciado fora deste compose).
  # Localmente não existe esse servidor, então subimos um container
  # apenas para desenvolvimento.
  postgres:
    image: postgres:16-alpine
    container_name: local_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-velyon}
      POSTGRES_USER: ${DB_USER:-dbadmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localdev123}
    ports:
      # Publicado no host só por conveniência (DBeaver/pgAdmin etc.).
      # Não afeta o requisito de "API interna": isto é o banco, não a API.
      - "5432:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dbadmin} -d ${DB_NAME:-velyon}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_network_local

  # ==================== Redis Cache (local) ====================
  redis:
    image: redis:7-alpine
    container_name: local_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-localdev123}
    expose:
      - "6379"
    volumes:
      - redis_local_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_network_local

  # ==================== Node.js API (interna apenas) ====================
  api:
    image: api-clinica:local
    build:
      context: ../../velyon_api
      dockerfile: ../velyon_infra/docker/Dockerfile.api.prod
    container_name: local_api
    restart: unless-stopped
    env_file:
      - ../../velyon_api/.env
    environment:
      NODE_ENV: development
      PORT: 3000
      FRONTEND_URL: http://localhost:8081
      CORS_ORIGIN: http://localhost,http://localhost:8081
      DATABASE_URL: postgresql://${DB_USER:-dbadmin}:${DB_PASSWORD:-localdev123}@postgres:5432/${DB_NAME:-velyon}
      REDIS_URL: redis://:${REDIS_PASSWORD:-localdev123}@redis:6379/0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-velyon}
      DB_USER: ${DB_USER:-dbadmin}
      DB_PASSWORD: ${DB_PASSWORD:-localdev123}
      DATABASE_SSL: "false"
    # Sem "ports": a API só é alcançável dentro da rede Docker,
    # via proxy interno do nginx (/api/, /socket.io/) — igual a produção.
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../velyon_api/logs:/app/logs
      - ../../velyon_api/tmp:/app/tmp
    networks:
      - app_network_local
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ==================== Frontend Tenant (interno, via nginx :8081) ====================
  frontend:
    image: tenant-frontend:local
    build:
      context: ../../velyon_frontend_tenant
      dockerfile: ../velyon_infra/docker/Dockerfile.frontend.prod
      # VITE_API_BASE_URL propositalmente NÃO definido: o frontend já
      # usa "/api" como padrão (relativo) quando a variável não existe
      # — funciona tanto em localhost:8081 quanto em qualquer domínio
      # de produção, sem precisar saber a URL pública da API.
    container_name: local_frontend
    restart: unless-stopped
    env_file:
      - ../../velyon_frontend_tenant/.env
    environment:
      NODE_ENV: production
      PORT: 5173
      EXTERNAL_API_URL: http://api:3000/api
    expose:
      - "5173"
    volumes:
      - ../../velyon_frontend_tenant/logs:/app/logs
      - ../../velyon_frontend_tenant/tmp:/app/tmp
    networks:
      - app_network_local
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ==================== Static Site Frontend (localhost :80) ====================
  site:
    image: site-frontend:local
    build:
      context: ../../velyon_frontend_site
      dockerfile: ../velyon_infra/docker/Dockerfile.site.prod
    container_name: local_site
    restart: unless-stopped
    expose:
      - "5174"
    networks:
      - app_network_local
    healthcheck:
      test:
        ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5174/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ==================== Nginx Reverse Proxy (local, sem SSL) ====================
  nginx:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nginx.local
    image: app-nginx:local
    container_name: local_nginx
    restart: unless-stopped
    ports:
      - "80:80"     # http://localhost        → site
      - "8081:8081" # http://localhost:8081   → tenant
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
      site:
        condition: service_healthy
    networks:
      - app_network_local
    healthcheck:
      test:
        ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_local_data:
  redis_local_data:

networks:
  app_network_local:
    driver: bridge
