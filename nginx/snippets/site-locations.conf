location /nginx-health {
    access_log off;
    return 200 "OK\n";
    add_header Content-Type text/plain;
}

location /health {
    access_log off;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
}

include /etc/nginx/snippets/block-scanners.conf;

# Rotas por path no domínio principal (fase 1 da migração)
# Estas rotas permitem acessar os serviços sem depender de subdomínios.
location = /tenant {
    return 301 /tenant/;
}

location /tenant/ {
    # proxy_pass usa variável ($tenant_upstream) pra sobreviver a
    # restart/recreate do container — mas isso desativa a
    # substituição automática de prefixo do nginx (só acontece
    # quando o destino do proxy_pass é estático). Sem o rewrite
    # abaixo, o nginx manda a URI original inteira (com /tenant/)
    # pro backend, que não conhece esse prefixo e cai no fallback
    # SPA (serve index.html pra tudo, inclusive manifest.json,
    # assets, etc.). O rewrite ...break corta o prefixo manualmente
    # antes do proxy_pass.
    rewrite ^/tenant/(.*)$ /$1 break;
    proxy_pass http://$tenant_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header X-Forwarded-Prefix /tenant;
    proxy_set_header Connection "";
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

