location /nginx-health {
    access_log off;
    return 200 "OK\n";
    add_header Content-Type text/plain;
}

location /health {
    access_log off;
    proxy_pass http://$frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
}

include /etc/nginx/snippets/block-scanners.conf;

# Service Worker: NUNCA pode ser cacheado de forma agressiva. Se o navegador
# (ou um proxy no meio do caminho) cachear o sw.js por muito tempo, os
# usuários ficam presos numa versão antiga do app/push por dias, mesmo após
# um novo deploy. Precisa sempre ser revalidado.
location = /sw.js {
    proxy_pass http://$frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Esconde o Cache-Control que o Express já manda (public, max-age=0)
    # antes de definir o nosso — senão a resposta sai com DOIS headers
    # Cache-Control, e o comportamento entre navegadores fica indefinido.
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Service-Worker-Allowed "/" always;
}

# Manifest do PWA: cache curto é suficiente, não precisa ser revalidado a
# cada request como o sw.js, mas também não deve ficar preso por dias.
location = /manifest.json {
    proxy_pass http://$frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=3600" always;
}

location /api/trpc {
    proxy_pass http://$frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header Connection "";
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;
}

location /socket.io/ {
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# Arquivos do MinIO (logos públicos e documentos via URL presigned),
# acessados pelo navegador em /minio/<bucket>/<objeto>[?assinatura...].
# O "/" no final do proxy_pass (depois de $minio_upstream) faz o nginx
# remover o prefixo "/minio/" do caminho antes de repassar — ex.:
# /minio/velyon-files/logos/x.png vira http://minio:9000/velyon-files/logos/x.png.
# Ver storageService.js (MINIO_PUBLIC_ENDPOINT=/minio) no velyon_api.
location /minio/ {
    proxy_pass http://$minio_upstream/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    # Documentos/imagens podem passar de 20M (client_max_body_size global)
    # se forem grandes o suficiente; MinIO já limita no upload (5MB logos,
    # 10MB documentos, ver storageService.js), então não precisa de um
    # client_max_body_size dedicado aqui — só leitura (GET) passa por essa
    # location.
}

# /api/* (exceto /api/trpc acima) → API Express, não o frontend.
# Necessário para rotas como /api/auth/google/callback (passport).
location /api/ {
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header Connection "";
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;
}

location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}

location / {
    proxy_pass http://$frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_cache_bypass $http_upgrade;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;
}
