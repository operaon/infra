# ============================================================
# Descarta tentativas comuns de scan automatizado (WordPress,
# painéis de admin genéricos, arquivos sensíveis) sem gastar
# tempo de proxy nem poluir o access log com 200/404/405.
# 444 = nginx fecha a conexão sem resposta (economiza recursos
# e não dá pista nenhuma pro scanner).
# ============================================================
location ~* ^/(wp-login\.php|wp-admin|wp-includes|wp-content|xmlrpc\.php|wordpress|wp\.php) {
    access_log off;
    return 444;
}

location ~* \.(env|git|htaccess|htpasswd|sql|bak|swp)$ {
    access_log off;
    return 444;
}
