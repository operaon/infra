# ============================================================
# Este arquivo antes definia upstreams estáticos:
#
#   upstream api_backend      { server api:3000; }
#   upstream frontend_backend { server frontend:5173; }
#   upstream site_backend     { server site:5174; }
#
# Problema: um bloco "upstream { server host:port; }" resolve o
# hostname (DNS do Docker) UMA VEZ, no boot do nginx, e cacheia o
# IP resolvido para sempre. Quando o container "api", "frontend"
# ou "site" é recriado/reiniciado (ex.: `docker compose up -d
# --force-recreate api frontend`), ele ganha um NOVO IP na rede
# app_network — mas o nginx continua mandando tráfego pro IP
# antigo (morto), gerando 502 Bad Gateway até alguém reiniciar o
# nginx manualmente (`docker compose restart nginx`).
#
# Correção: os proxy_pass agora usam variáveis (ver
# nginx/conf.d/10-http.conf e 20-https.conf.template, que fazem
# `set $api_upstream api:3000;` etc. antes do include dos
# snippets) combinadas com o `resolver 127.0.0.11 valid=10s;`
# definido em nginx.conf. Isso força o nginx a re-resolver o
# hostname a cada 10s, então ele se recupera sozinho de qualquer
# recreate/restart dos containers de aplicação, sem precisar
# reiniciar o nginx.
# ============================================================
