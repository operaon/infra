# ============================================================
# HTTP (porta 80) — sempre ativo nos 4 domínios de app (site, tenant,
# paciente e api).
#
# Serve o tráfego real, não apenas um placeholder: assim o stack
# funciona tanto localmente (sem certificado, acessando os domínios
# via /etc/hosts → 127.0.0.1) quanto em produção, antes mesmo do
# primeiro certificado SSL ser emitido.
#
# Em produção, quando os certificados existem, o
# nginx/docker-entrypoint.d/10-enable-ssl.sh habilita também os
# blocos HTTPS (20-https.conf) nesses mesmos domínios — HTTP e
# HTTPS coexistem, sem redirect forçado (mesmo comportamento que
# o setup anterior já tinha).
# ============================================================

# ------------------------------------------------------------
# velyonrobotics.com (+ www) → site estático
# ------------------------------------------------------------
server {
    listen 80;
    server_name velyonrobotics.com www.velyonrobotics.com velyonrobotics.local www.velyonrobotics.local;

    # Resolvido dinamicamente a cada request (ver "resolver" em
    # nginx.conf) em vez de upstream estático — sobrevive a
    # recreate/restart do container "site".
    set $site_upstream site:5174;
    set $api_upstream api:3000;

    # Necessário para o certbot emitir/renovar certificados em produção.
    # Em ambiente local não tem efeito (não há certbot rodando).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    include /etc/nginx/snippets/site-locations.conf;
}

# ------------------------------------------------------------
# fisioterapeuta.velyonrobotics.com → frontend (tenant app)
# ------------------------------------------------------------
server {
    listen 80;
    server_name fisioterapeuta.velyonrobotics.com fisioterapeuta.velyonrobotics.local;

    # Resolvidos dinamicamente a cada request (ver "resolver" em
    # nginx.conf) em vez de upstream estático — sobrevive a
    # recreate/restart dos containers "frontend" e "api".
    set $frontend_upstream frontend:5173;
    set $api_upstream api:3000;
    set $minio_upstream minio:9000;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    include /etc/nginx/snippets/tenant-locations.conf;
}

# ------------------------------------------------------------
# paciente.velyonrobotics.com → frontend (client/paciente app)
# ------------------------------------------------------------
server {
    listen 80;
    server_name paciente.velyonrobotics.com paciente.velyonrobotics.local;

    # Resolvidos dinamicamente a cada request (ver "resolver" em
    # nginx.conf) em vez de upstream estático — sobrevive a
    # recreate/restart dos containers "client" e "api".
    set $client_upstream client:5175;
    set $api_upstream api:3000;
    set $minio_upstream minio:9000;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    include /etc/nginx/snippets/client-locations.conf;
}

# ------------------------------------------------------------
# api.velyonrobotics.com → API (Node.js)
# ------------------------------------------------------------
server {
    listen 80;
    server_name api.velyonrobotics.com api.velyonrobotics.local;

    # Resolvido dinamicamente a cada request (ver "resolver" em
    # nginx.conf) em vez de upstream estático — sobrevive a
    # recreate/restart do container "api".
    set $api_upstream api:3000;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    include /etc/nginx/snippets/api-locations.conf;
}

# ------------------------------------------------------------
# chat.velyonrobotics.com → velyon_chat (Node.js + Socket.IO, porta 4000)
# ------------------------------------------------------------
# O serviço de chat roda na mesma rede Docker do velyon_infra
# (container_name: velyon_chat). O Nginx faz proxy reverso para
# chat:4000 — o Docker DNS interno resolve automaticamente o nome
# do container. chat.velyonrobotics.local é mantido para
# desenvolvimento local (via /etc/hosts).
# ------------------------------------------------------------
server {
    listen 80;
    server_name chat.velyonrobotics.local chat.velyonrobotics.com;

    # Nome do service no docker-compose.yml → Docker DNS resolve
    # automaticamente. Sem upstream estático — usa variável + resolver.
    set $chat_upstream chat:4000;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # WebSocket (Socket.IO) — upgrade necessário para WSS
    location /socket.io/ {
        proxy_pass http://$chat_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # REST API do chat (inclui /api/health, /api/auth/*, /api/conversations/*, etc.)
    location /api/ {
        proxy_pass http://$chat_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}

# ------------------------------------------------------------
# Fallback para Host não reconhecido (ex.: acesso direto por IP)
# ------------------------------------------------------------
server {
    listen 80 default_server;
    server_name _;

    location /nginx-health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 404;
    }
}
