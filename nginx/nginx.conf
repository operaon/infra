user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 20M;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 15s;
    large_client_header_buffers 4 8k;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml application/atom+xml image/svg+xml
               text/x-component text/x-cross-domain-policy
               font/truetype font/opentype application/vnd.ms-fontobject;
    gzip_disable "msie6";

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=15r/s;
    limit_req_zone $binary_remote_addr zone=frontend_limit:10m rate=50r/s;

    # DNS embutido do Docker (só funciona em bridge networks customizadas,
    # como app_network). Sem isso, os hostnames dos serviços (api, frontend,
    # site) usados nos proxy_pass abaixo são resolvidos UMA VEZ, no boot do
    # nginx, e o IP fica em cache para sempre — quando um container é
    # recriado ou reinicia (ganhando um novo IP na rede), o nginx continua
    # tentando o IP antigo e morto, gerando 502 Bad Gateway até o nginx ser
    # reiniciado manualmente. Com o resolver, o nginx re-resolve o hostname
    # a cada 10s (valid=10s), então ele se recupera sozinho.
    # ipv6=off: a rede app_network (bridge padrão do Docker) não tem IPv6
    # configurado. Sem essa flag, o resolver assíncrono do nginx consulta
    # AAAA junto com A a cada re-resolução e, quando o DNS embutido do
    # Docker responde de forma incompleta pro AAAA, o nginx trata como
    # "Host not found" mesmo o A existindo — derrubando o proxy_pass
    # (ex.: frontend could not be resolved). Forçando só IPv4 elimina isso.
    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/conf.d/*.conf;
}